name: "Ops: read-only image-backfill diagnostic (temporary)"

# TEMPORARY, READ-ONLY — to be removed after use. Inspects worker container
# health, Celery queue depth, and recent logs to debug why some products
# never get an image after refresh_product_price is enqueued.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → inspect worker/queue state
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER_SECRET: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESOLVED_USER="${EC2_USER_SECRET:-ubuntu}"

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${RESOLVED_USER}@${EC2_HOST}" 'bash -s' << 'ENDSSH'
          cd /opt/pricebasket/repo
          echo "===== docker compose ps ====="
          docker compose ps
          echo ""
          echo "===== celery queue depth (redis list 'prices') ====="
          docker compose exec -T redis redis-cli -n 1 llen prices || true
          docker compose exec -T redis redis-cli llen prices || true
          echo ""
          echo "===== worker logs (last 150 lines) ====="
          docker compose logs worker --tail 150
          echo ""
          echo "===== worker logs grep for our test product / errors ====="
          docker compose logs worker --tail 3000 | grep -iE "817f533e|scrape_failed|price_persist_failed|Traceback|amazon_using|bigbasket_using|refresh_product_price" | tail -100
          ENDSSH
          rm -f /tmp/deploy_key
