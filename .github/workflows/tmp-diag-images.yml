name: "Ops: read-only image-backfill diagnostic (temporary)"

# TEMPORARY, READ-ONLY — to be removed once the queue-consumption fix is
# confirmed and the backlog has drained. Inspects Celery queue depth only;
# does not restart or modify anything beyond what deploy-dev.yml already does
# on every dev push.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → check queue depth
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER_SECRET: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESOLVED_USER="${EC2_USER_SECRET:-ubuntu}"

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${RESOLVED_USER}@${EC2_HOST}" 'bash -s' << 'ENDSSH'
          cd /opt/pricebasket/repo
          echo "===== docker compose ps ====="
          docker compose ps
          echo ""
          echo "===== queue depths ====="
          echo -n "prices: "; docker compose exec -T redis redis-cli -n 1 llen prices
          echo -n "notifications: "; docker compose exec -T redis redis-cli -n 1 llen notifications
          echo -n "celery (default): "; docker compose exec -T redis redis-cli -n 1 llen celery
          echo ""
          echo "===== worker logs (last 60 lines) ====="
          docker compose logs worker --tail 60
          ENDSSH
          rm -f /tmp/deploy_key
