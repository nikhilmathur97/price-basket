name: "Ops: one-off deactivate products still missing images (temporary)"

# TEMPORARY — to be removed after use. Runs backend/scripts/deactivate_missing_images.py
# inside the running worker container via SSH, since local dev sandboxes can't
# reach EC2 on port 22.

on:
  workflow_dispatch:

jobs:
  deactivate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH → run deactivate_missing_images inside worker container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER_SECRET: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESOLVED_USER="${EC2_USER_SECRET:-ubuntu}"

          B64=$(base64 -w0 backend/scripts/deactivate_missing_images.py)

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${RESOLVED_USER}@${EC2_HOST}" "
          set -e
          echo '${B64}' | base64 -d > /tmp/deactivate_missing_images.py
          cd /opt/pricebasket/repo
          docker compose cp /tmp/deactivate_missing_images.py worker:/tmp/deactivate_missing_images.py
          docker compose exec -T -e PYTHONPATH=/app worker python /tmp/deactivate_missing_images.py
          rm -f /tmp/deactivate_missing_images.py
          "
          rm -f /tmp/deploy_key
