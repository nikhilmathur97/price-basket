name: "Ops: read-only DB connection + queue diagnostic (temporary)"

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → check celery queue depth + pg connection count
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER_SECRET: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESOLVED_USER="${EC2_USER_SECRET:-ubuntu}"
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            "${RESOLVED_USER}@${EC2_HOST}" '
          set -e
          cd /opt/pricebasket/repo
          echo "── celery queue depths (redis, db1) ──"
          docker compose exec -T redis redis-cli -n 1 LLEN prices || true
          docker compose exec -T redis redis-cli -n 1 LLEN notifications || true
          docker compose exec -T redis redis-cli -n 1 LLEN celery || true
          echo "── docker container count/health ──"
          docker compose ps
          echo "── postgres process count on host (approx, via docker top) ──"
          docker compose top postgres | wc -l
          '
          rm -f /tmp/deploy_key
