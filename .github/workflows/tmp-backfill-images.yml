name: "Ops: one-off backfill missing product images (temporary)"

# TEMPORARY — to be removed after use. Runs backend/scripts/backfill_missing_images.py
# inside the running worker container via SSH, since local dev sandboxes can't
# reach EC2 on port 22.

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → run backfill_missing_images inside worker container
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER_SECRET: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESOLVED_USER="${EC2_USER_SECRET:-ubuntu}"

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${RESOLVED_USER}@${EC2_HOST}" 'bash -s' << 'ENDSSH'
          set -e
          cd /opt/pricebasket/repo
          docker compose exec -T worker python -m scripts.backfill_missing_images
          ENDSSH
          rm -f /tmp/deploy_key
