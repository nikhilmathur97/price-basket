name: "Ops: EMERGENCY stop worker + dump logs (temporary)"

on:
  workflow_dispatch:

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: SSH → stop worker, dump full logs, snapshot queue
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER_SECRET: ${{ secrets.EC2_USER }}
        run: |
          echo "$EC2_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          RESOLVED_USER="${EC2_USER_SECRET:-ubuntu}"

          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${RESOLVED_USER}@${EC2_HOST}" 'bash -s' << 'ENDSSH'
          cd /opt/pricebasket/repo
          echo "===== queue depth BEFORE stop ====="
          docker compose exec -T redis redis-cli -n 1 llen prices < /dev/null

          echo "===== stopping worker container ====="
          docker compose stop worker < /dev/null

          echo "===== queue depth AFTER stop ====="
          docker compose exec -T redis redis-cli -n 1 llen prices < /dev/null

          echo "===== full worker logs (last 500 lines) ====="
          docker compose logs worker --tail 500 < /dev/null
          ENDSSH
          rm -f /tmp/deploy_key
